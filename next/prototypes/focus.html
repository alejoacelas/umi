<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focused Pane Options</title>
<style>
/* Umi next's own tokens (next/app/web/style.css), so the mock looks like the app. */
:root {
  --bg: #050505;
  --ink: rgba(255, 255, 255, 0.9);
  --dim: rgba(255, 255, 255, 0.6);
  --sidebar: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.10);
  --accent: #19aad8;
  --divider: #262626;
  --titlebar: 32px;
  --mono: "SF Mono", Menlo, monospace;
  --thick: 2px;
  --dimlevel: 0.55;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink);
  font: 12px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
body { display: flex; flex-direction: column; }

/* Controls */
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px;
  background: #151515; border-bottom: 1px solid var(--line); }
#bar h1 { font-size: 13px; font-weight: 600; margin: 0 8px 0 0; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid transparent; border-radius: 6px;
  padding: 4px 9px; font: inherit; cursor: pointer; }
.opt kbd { opacity: 0.55; margin-right: 5px; font: 11px var(--mono); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: rgba(25,170,216,0.15); }
#bar label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
#bar input[type=range] { width: 90px; }
#note { padding: 8px 16px; color: var(--dim); background: #0d0d0d; border-bottom: 1px solid var(--line); min-height: 34px; }
#note b { color: var(--ink); font-weight: 600; }

/* The mock window */
#win { flex: 1; min-height: 0; display: flex; margin: 16px; border: 1px solid #2a2a2a; border-radius: 10px;
  overflow: hidden; background: var(--bg); }
#sidebar { width: 210px; flex: none; background: var(--sidebar); border-right: 1px solid var(--line);
  padding: calc(var(--titlebar) + 6px) 8px 8px; }
.tab { padding: 6px 8px; border-radius: 6px; color: var(--dim); margin-bottom: 2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.tab.on { background: rgba(255,255,255,0.08); color: var(--ink); }
#work { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
#strip { height: var(--titlebar); display: flex; align-items: center; gap: 2px; padding: 0 8px; flex: none; }
.chip { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px;
  color: rgba(255,255,255,0.8); font-weight: 500; cursor: pointer; position: relative; }
.chip.focused { background: rgba(255,255,255,0.085); color: rgba(255,255,255,0.95); }
.chip .sw { width: 7px; height: 7px; border-radius: 2px; flex: none; }
#panes { flex: 1; min-height: 0; display: flex; }
.split { display: flex; flex: 1; min-width: 0; min-height: 0; }
.split.col { flex-direction: column; }
.divider { flex: none; background: var(--divider); }
.split.row > .divider { width: 1px; }
.split.col > .divider { height: 1px; }

.pane { flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column;
  cursor: text; background: var(--bg); transition: opacity .12s, filter .12s, background .12s; }
.head { display: none; height: 22px; flex: none; align-items: center; gap: 6px; padding: 0 10px;
  font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); background: #0b0b0b; }
.head .sw { width: 7px; height: 7px; border-radius: 2px; }
.term { flex: 1; min-height: 0; overflow: hidden; padding: 8px 10px; font: 12px/1.45 var(--mono);
  color: #d6d6d6; white-space: pre; }
.term .g { color: #7fd47f; } .term .y { color: #e0b04a; } .term .c { color: #6ccbe8; } .term .d { color: #777; }
.cursor { display: inline-block; width: 7px; height: 14px; vertical-align: -2px; background: transparent;
  outline: 1px solid #bbb; }
.pane.focused .cursor { background: #ddd; outline: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; }

/* ---- the options ---- */
/* 0. Today: the focused pane 3% brighter. */
[data-o="today"] .pane.focused { background: #0c0c0c; }

/* 1. Accent border round the focused pane. */
[data-o="border"] .pane.focused .overlay { box-shadow: inset 0 0 0 var(--thick) var(--accent); }

/* 2. Dim the other panes. */
[data-o="dim"] .pane:not(.focused) .term { opacity: var(--dimlevel); }

/* 3. Accent bar along the focused pane's top edge. */
[data-o="topbar"] .pane.focused .overlay { border-top: calc(var(--thick) + 1px) solid var(--accent); }

/* 4. A header per pane; the focused one lit in the accent. */
[data-o="headers"] .head { display: flex; }
[data-o="headers"] .pane.focused .head { background: rgba(25,170,216,0.18); color: var(--ink); border-bottom-color: var(--accent); }

/* 5. Dim others + thin border: both cues at once. */
[data-o="combo"] .pane:not(.focused) .term { opacity: var(--dimlevel); }
[data-o="combo"] .pane.focused .overlay { box-shadow: inset 0 0 0 1px var(--accent); }

/* 6. Each pane a colour; the focused pane's colour fills its strip chip and edges the pane. */
[data-o="colors"] .chip .sw { display: block; }
[data-o="colors"] .chip.focused { background: color-mix(in srgb, var(--pc) 28%, transparent); }
[data-o="colors"] .pane.focused .overlay { box-shadow: inset 0 0 0 var(--thick) var(--pc); }
[data-o="colors"] .pane:not(.focused) .term { opacity: 0.8; }
.chip .sw { display: none; }

/* 7. Glow: a soft accent shadow inside the focused pane. */
[data-o="glow"] .pane.focused .overlay { box-shadow: inset 0 0 0 1px rgba(25,170,216,0.6), inset 0 0 28px rgba(25,170,216,0.22); }

@media (max-width: 700px) { #sidebar { display: none; } #win { margin: 8px; } }
</style>
</head>
<body>
<div id="bar">
  <h1>Which pane has focus?</h1>
  <div class="opts" id="opts"></div>
  <label>Thickness <input id="thick" type="range" min="1" max="4" step="1" value="2"></label>
  <label>Dim others <input id="dimlvl" type="range" min="0.3" max="0.9" step="0.05" value="0.55"></label>
</div>
<div id="note"></div>
<div id="win">
  <div id="sidebar">
    <div class="tab on">umi · focus</div>
    <div class="tab">desk</div>
    <div class="tab">dotfiles</div>
  </div>
  <div id="work">
    <div id="strip"></div>
    <div id="panes">
      <div class="split row">
        <div class="pane" data-id="a" style="--pc:#19aad8"><div class="head"><span class="sw" style="background:#19aad8"></span>claude · umi-next ⌘W</div><div class="term"></div><div class="overlay"></div></div>
        <div class="divider"></div>
        <div class="split col">
          <div class="pane" data-id="b" style="--pc:#c58af9"><div class="head"><span class="sw" style="background:#c58af9"></span>codex · daemon tests</div><div class="term"></div><div class="overlay"></div></div>
          <div class="divider"></div>
          <div class="pane" data-id="c" style="--pc:#7fd47f"><div class="head"><span class="sw" style="background:#7fd47f"></span>zsh · ~/best/projects</div><div class="term"></div><div class="overlay"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const OPTIONS = [
  ['today', 'Today', '<b>Today:</b> the focused pane is 3% brighter. Shown for comparison.'],
  ['border', 'Border', '<b>Border:</b> an accent line round the focused pane. Native would draw it over the terminal (or inset the terminal by the thickness).'],
  ['dim', 'Dim others', '<b>Dim others:</b> unfocused panes fade. Ghostty does this itself (<code>unfocused-split-opacity</code>), so it is the cheapest to build.'],
  ['topbar', 'Top bar', '<b>Top bar:</b> an accent bar along the focused pane\'s top edge, like an active editor tab.'],
  ['headers', 'Pane headers', '<b>Pane headers:</b> each pane gets a slim title row; the focused one is lit. Costs a row of height per pane.'],
  ['combo', 'Dim + thin border', '<b>Dim + thin border:</b> unfocused panes fade and the focused one gets a 1px accent edge.'],
  ['colors', 'Pane colours', '<b>Pane colours:</b> each pane has a colour; the focused pane\'s colour fills its chip in the top bar and edges the pane, tying the two together.'],
  ['glow', 'Glow', '<b>Glow:</b> a soft accent glow inside the focused pane\'s edges.'],
];
const TEXT = {
  a: `<span class="d">╭─ claude ────────────────────────────╮</span>
<span class="c">›</span> restore cmd W to kill the session

<span class="g">●</span> Rewired ⌘W in model.js: it ends the
  session; ⌥⌘H hides it.
<span class="g">●</span> Updated shortcuts_test.py.

<span class="y">Status:</span> in progress: tests next

<span class="c">›</span> <span class="cursor"></span>`,
  b: `<span class="d">codex</span>  ./test.sh
test_daemon.py::test_exit_status <span class="g">PASSED</span>
test_daemon.py::test_send        <span class="g">PASSED</span>
test_daemon.py::test_latency     <span class="g">PASSED</span>
<span class="g">11 passed</span> in 16.27s
<span class="c">›</span> <span class="cursor"></span>`,
  c: `<span class="g">alejo@alejo-m4</span> <span class="c">~/best/projects</span> % git log --oneline -3
<span class="y">3ae6dbf</span> umi-next: ⌘W closes the pane
<span class="y">d0565ad</span> umi-next: new sessions drop markers
<span class="y">69ab24c</span> umi-next: sessions an agent opens
<span class="g">alejo@alejo-m4</span> <span class="c">~/best/projects</span> % <span class="cursor"></span>`,
};
const ORDER = ['a', 'b', 'c'];
const NAMES = { a: 'claude · umi-next', b: 'codex · daemon tests', c: 'zsh' };
const COLORS = { a: '#19aad8', b: '#c58af9', c: '#7fd47f' };
let opt = 'border', focus = 'a';
try { opt = localStorage.getItem('focus-opt') || opt; } catch (e) {}

const win = document.getElementById('win');
document.querySelectorAll('.pane').forEach((p) => {
  p.querySelector('.term').innerHTML = TEXT[p.dataset.id];
  p.addEventListener('mousedown', () => { focus = p.dataset.id; draw(); });
});
const opts = document.getElementById('opts');
OPTIONS.forEach(([id, label], i) => {
  const b = document.createElement('button');
  b.className = 'opt'; b.dataset.id = id;
  b.innerHTML = `<kbd>${i + 1}</kbd>${label}`;
  b.addEventListener('click', () => { opt = id; draw(); });
  opts.appendChild(b);
});
function draw() {
  win.dataset.o = opt;
  try { localStorage.setItem('focus-opt', opt); } catch (e) {}
  opts.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === opt)));
  document.getElementById('note').innerHTML = OPTIONS.find((o) => o[0] === opt)[2] +
    ' <span style="opacity:.7">Click a pane or press ←↑↓→ / Tab to move focus; 1–8 switch options.</span>';
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('focused', p.dataset.id === focus));
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  ORDER.forEach((id) => {
    const c = document.createElement('div');
    c.className = 'chip' + (id === focus ? ' focused' : '');
    c.style.setProperty('--pc', COLORS[id]);
    c.innerHTML = `<span class="sw" style="background:${COLORS[id]}"></span><span>${NAMES[id]}</span>`;
    c.addEventListener('mousedown', () => { focus = id; draw(); });
    strip.appendChild(c);
  });
}
// Layout: a on the left, b over c on the right.
const MOVES = { a: { right: 'b' }, b: { left: 'a', down: 'c' }, c: { left: 'a', up: 'b' } };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= OPTIONS.length) { opt = OPTIONS[n - 1][0]; return draw(); }
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (dir && MOVES[focus][dir]) { e.preventDefault(); focus = MOVES[focus][dir]; return draw(); }
  if (e.key === 'Tab') { e.preventDefault(); focus = ORDER[(ORDER.indexOf(focus) + (e.shiftKey ? 2 : 1)) % 3]; draw(); }
});
document.getElementById('thick').addEventListener('input', (e) => document.documentElement.style.setProperty('--thick', e.target.value + 'px'));
document.getElementById('dimlvl').addEventListener('input', (e) => document.documentElement.style.setProperty('--dimlevel', e.target.value));
// A slider let go hands the keys back, so 1–8 and the arrows work again at once.
document.querySelectorAll('#bar input').forEach((i) => i.addEventListener('change', () => i.blur()));
draw();
</script>
</body>
</html>
