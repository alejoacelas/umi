# umi-next's terminal defaults (from Umi's UmiTheme.swift), loaded before ~/.config/umi/config.
# The window, tab and split keys belong to the UI (native shortcut table → web actions), so the
# window never sees Ghostty's own bindings for them.
background = #050505
foreground = #ffffff
cursor-color = #19aad8
selection-background = #76a7fa
selection-background-opacity = 0.4
selection-foreground = cell-foreground
palette = 0=#616161
palette = 1=#ff8272
palette = 2=#b4fa72
palette = 3=#fefdc2
palette = 4=#a5d5fe
palette = 5=#ff8ffd
palette = 6=#d0d1fe
palette = 7=#f1f1f1
palette = 8=#8e8e8e
palette = 9=#ffc4bd
palette = 10=#d6fcb9
palette = 11=#fefdd5
palette = 12=#c1e3fe
palette = 13=#ffb1fe
palette = 14=#e5e6fe
palette = 15=#feffff

cursor-style = bar
font-size = 13
adjust-cell-height = 3%
adjust-cursor-height = 3%
font-feature = -calt
font-feature = -liga
font-feature = -dlig
window-padding-x = 12
window-padding-y = 8
window-padding-color = extend
mouse-hide-while-typing = true
minimum-contrast = 4.5
bell-features = no-system,no-audio,no-attention,no-title,no-border
confirm-close-surface = false
